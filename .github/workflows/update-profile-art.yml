name: Update profile art

# Refreshes the contribution graph + stats card daily from real data.
# The ASCII portrait is built once from the GitHub avatar (or from source-photo.png
# if you commit one), and rebuilt when you run the workflow manually with
# "regenerate_portrait" ticked.

"on":
  schedule:
    - cron: "17 5 * * *"   # ~06:17 heure de Paris (hiver)
  workflow_dispatch:
    inputs:
      regenerate_portrait:
        description: "Rebuild the ASCII portrait from the current avatar / source-photo.png"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write

env:
  GH_PROFILE_USER: BurgyDev
  PROFILE_NAME: "Mathys · BurgyDev"

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape real contribution data (no token needed)
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution graph
        run: python scripts/generate_streak_svg.py "$GH_PROFILE_USER" contrib-heatmap.svg

      - name: Render streak / numbers card
        run: python scripts/render_stats_svg.py

      - name: Build ASCII portrait (first run, or on request)
        if: ${{ hashFiles('portrait-ascii.svg') == '' || inputs.regenerate_portrait }}
        run: |
          # a photo you committed yourself wins; otherwise use the GitHub avatar
          if [ ! -f source-photo.png ]; then
            curl -sSL -o source-photo.png "https://github.com/${GH_PROFILE_USER}.png?size=600"
          fi
          python scripts/prep_photo.py source-photo.png source-prepped.png
          python scripts/make_ascii_svg.py source-prepped.png portrait-ascii.svg

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg portrait-ascii.svg source-photo.png source-prepped.png"
